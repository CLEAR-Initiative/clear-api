name: Build & deploy prod
on:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  check:
    name: Check tag
    runs-on: ubuntu-latest
    permissions: {}
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Extract version from tag
        id: version
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [[ "$REF_TYPE" != "tag" ]]; then
            echo "::error::This workflow must be run on a tag, got $REF_TYPE '$REF_NAME'"
            exit 1
          fi
          if [[ ! "$REF_NAME" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Tag '$REF_NAME' does not match MAJOR.MINOR.PATCH"
            exit 1
          fi
          echo "version=$REF_NAME" >> "$GITHUB_OUTPUT"

  build:
    name: Build & push image
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/build-image
        with:
          environment: prod
          version: ${{ needs.check.outputs.version }}
          registry-token: ${{ secrets.GITHUB_TOKEN }}

  deploy:
    name: Deploy to prod
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    environment: prod
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/deploy
        with:
          host: ${{ secrets.APP_VM_HOST }}
          ssh-key: ${{ secrets.APP_VM_SSH_KEY }}
          registry-token: ${{ secrets.GITHUB_TOKEN }}

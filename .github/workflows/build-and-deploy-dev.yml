name: Tag, Build & deploy dev
on:
  push:
    branches: [dev]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # The version tag used to be its own job: ~6 s of work billed as a full
  # minute plus a checkout and a scheduling hop on the merge-to-live path.
  # It now runs at the top of the build job, still strictly before the image
  # is built so the tag and the image version never disagree.
  build:
    name: Build & push image
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v4

      # Idempotent: a re-run of a failed build reuses the version tag this
      # commit already has instead of allocating the next one and leaving the
      # previous tag without an image.
      - name: Compute version
        id: version
        run: |
          TAGS=$(git ls-remote --tags --refs origin)
          EXISTING=$(echo "$TAGS" | awk -v sha="$GITHUB_SHA" '$1 == sha { sub(".*/", "", $2); print $2 }' | grep -E '^[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -n 1 || true)
          if [ -n "$EXISTING" ]; then
            echo "Reusing existing tag $EXISTING for $GITHUB_SHA"
            echo "version=$EXISTING" >> "$GITHUB_OUTPUT"
            echo "existing=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          LATEST=$(echo "$TAGS" | sed 's#.*refs/tags/##' | grep -E '^[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -n 1)
          IFS=. read -r MAJOR MINOR PATCH <<< "${LATEST:-0.0.0}"
          echo "version=${MAJOR}.${MINOR}.$((PATCH + 1))" >> "$GITHUB_OUTPUT"
          echo "existing=false" >> "$GITHUB_OUTPUT"

      - name: Create git tag
        if: steps.version.outputs.existing != 'true'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          git tag "$VERSION" "$GITHUB_SHA"
          git push origin "refs/tags/$VERSION"

      - uses: ./.github/actions/build-image
        with:
          environment: ${{ github.ref_name }}
          version: ${{ steps.version.outputs.version }}
          registry-token: ${{ secrets.GITHUB_TOKEN }}

  deploy:
    name: Deploy to ${{ github.ref_name }}
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    environment: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/deploy
        with:
          host: ${{ secrets.APP_VM_HOST }}
          ssh-key: ${{ secrets.APP_VM_SSH_KEY }}
          registry-token: ${{ secrets.GITHUB_TOKEN }}

name: CI

on:
  pull_request:
    branches: [main, dev, staging]
  push:
    branches: [main, dev, staging]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - run: bun install --frozen-lockfile
      - run: bunx prisma generate
      - run: bun run lint
      - run: bun run typecheck
      # Fail if the committed generated docs drifted from its source template.
      - name: Docs HTML is in sync with template
        run: bun run build:docs && git diff --exit-code src/docs/docs-body.html
      # Same compile path as Dockerfile (`bun run build`). This runner has
      # Node, so `tsx` would still succeed here — the bun-vs-tsx gate is
      # tests/docs/build-docs-runtime.test.ts.
      - run: bun run build

      # Run the DB-free test suite WITH coverage, and gate on the thresholds in
      # vitest.config.ts (calibrated to the DB-free baseline). The DB-backed
      # integration tests need a seeded Postgres + PostGIS (specific dev-DB
      # UUIDs and Sudan admin polygons), so they're skipped here via
      # SKIP_DB_TESTS=1. The dummy env vars below only need to satisfy the
      # src/utils/env.ts schema parse at import time — no real services are
      # contacted, since those describe blocks are skipped. Running the full
      # DB-backed suite in CI (reusing the E2E Postgres) is a noted fast follow.
      - name: Test (DB-free) + coverage gate
        run: bun run test:ci:coverage
        env:
          DATABASE_URL: postgresql://dummy:dummy@localhost:5432/dummy
          BETTER_AUTH_SECRET: ci-dummy-secret-at-least-32-chars-long-xxxx
          BETTER_AUTH_URL: http://localhost:4000

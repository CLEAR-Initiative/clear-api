name: CI

on:
  pull_request:
    branches: [main, dev, staging]
  push:
    branches: [main, dev, staging]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - run: bun install --frozen-lockfile
      - run: bunx prisma generate
      - run: bun run lint
      - run: bun run typecheck
      # Fail if the committed generated docs drifted from its source template.
      - name: Docs HTML is in sync with template
        run: bun run build:docs && git diff --exit-code src/docs/docs.html
      # - run: bun run test

name: Check

on:
  pull_request:
    # prod gets PR CI for the periodic dev -> prod sync PRs.
    branches: [dev, prod]
    # `edited` re-runs the check when the author fills in the PR description's
    # "Manual deploy steps" section.
    types: [opened, synchronize, reopened, edited]
  push:
    branches: [dev]

# Cancel a superseded run only for pull_request events (keyed on the PR
# number). Push-to-dev runs are keyed on the SHA and never cancelled: with
# branch protection's strict mode off they are the only test of the merged
# result. Greptile auto-merge ignores the cancelled run (workflow_run
# conclusion 'cancelled' -> evaluate skips) and acts on the new head's run.
concurrency:
  group: check-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    runs-on: ubuntu-latest
    # Normal runs are ~1.5 min; the default 360-min cap once let a hung run
    # block the required check for 15 min until cancelled by hand.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - run: bun install --frozen-lockfile
      - run: bunx prisma generate
      - run: bun run lint
      - run: bun run typecheck
      # Fail if the committed generated docs drifted from its source template.
      - name: Docs HTML is in sync with template
        run: bun run build:docs && git diff --exit-code src/docs/docs-body.html
      # Same compile path as Dockerfile (`bun run build`). This runner has
      # Node, so `tsx` would still succeed here — the bun-vs-tsx gate is
      # tests/docs/build-docs-runtime.test.ts.
      - run: bun run build

      # Run the DB-free test suite WITH coverage, and gate on the thresholds in
      # vitest.config.ts (calibrated to the DB-free baseline). DB-backed suites
      # are skipped here via SKIP_DB_TESTS=1 and run in the db-tests job below.
      # The dummy env vars only need to satisfy the src/utils/env.ts schema
      # parse at import time — no real services are contacted.
      - name: Test (DB-free) + coverage gate
        run: bun run test:ci:coverage
        env:
          DATABASE_URL: postgresql://dummy:dummy@localhost:5432/dummy
          BETTER_AUTH_SECRET: ci-dummy-secret-at-least-32-chars-long-xxxx
          BETTER_AUTH_URL: http://localhost:4000

      # A step the code needs but no code performs must be written down with a
      # prod checkbox and a ticket, or the PR says "None" (clear #1524).
      #
      # Every PR a person writes the body of, into `dev` or into `prod`. The
      # exemption is exactly one PR: THIS repo's dev -> prod sync, whose body is
      # generated by sync-pr-body.yml in its own grammar and whose prod boxes are
      # gated by that workflow's review instead. All three conditions are load
      # bearing -- `head_ref == 'dev'` alone also matches a fork whose own branch
      # is called `dev`, which is a PR a person wrote the body of and which the
      # old `base_ref == 'dev'` form did check. Bot PRs stay exempt because
      # nobody wrote their body. What this adds is the hotfix PR -- branched from
      # `prod`, straight into `prod`, written under time pressure -- which until
      # now was checked by nothing at all (clear #1550).
      #
      # Last in the job, and `!cancelled()`, so a missing section reports its own
      # verdict without suppressing lint, types, the build and the tests. On a
      # hotfix that matters: the section is a warning (prod requires no status
      # checks), and a warning must not hide whether the code itself is sound.
      - name: Manual deploy steps section is filled in
        if: >-
          !cancelled()
          && github.event_name == 'pull_request'
          && github.event.pull_request.user.type != 'Bot'
          && !(github.base_ref == 'prod'
          && github.head_ref == 'dev'
          && github.event.pull_request.head.repo.full_name == github.repository)
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          node --test .github/scripts/check-manual-deploy-steps.test.mjs
          node .github/scripts/check-manual-deploy-steps.mjs

  # The suite again, against a fresh Postgres built like production's (PostGIS
  # + pgvector) with every migration applied from empty — so migrations and
  # the self-seeding DB suites (`describeIfDb`) are checked on every PR.
  # Suites that need dev seed data (`describeIfSeededDb`) stay skipped.
  # No coverage gate: the thresholds are calibrated to the DB-free run.
  db-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - run: bun install --frozen-lockfile
      - run: bunx prisma generate

      # Build the scratch Postgres image through the Actions cache and load it
      # into the daemon; TEST_DB_SKIP_BUILD below tells scripts/test-db.sh to
      # use that image instead of repeating its own `docker build` (the plain
      # builder cannot see the buildx builder's cache). Local runs still build.
      # Measured on PR #219: cold cache 48 s (build + export), warm 18 s.
      - uses: docker/setup-buildx-action@v3
      - name: Build scratch Postgres image (cached)
        uses: docker/build-push-action@v6
        with:
          context: tests/db
          platforms: linux/amd64
          load: true
          tags: clear-api-test-db
          cache-from: type=gha,scope=test-db
          cache-to: type=gha,mode=max,scope=test-db

      - name: Test against a migrated scratch database
        run: bun run test:db
        env:
          TEST_DB_SKIP_BUILD: "1"

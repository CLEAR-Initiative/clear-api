name: Greptile auto-merge

# Squash-merges a PR into the default branch once Greptile has reviewed the PR's latest
# commit and left no unresolved P0/P1 finding on it, and every required check has passed.
# P2s don't block. Anything else — a P0/P1, no Greptile review on the latest commit, a
# draft, a fork, a bot author (Dependabot, Copilot…), the `no-automerge` label — leaves the
# PR for a human.
#
# The merge is always pinned to the commit Greptile reviewed (`sha` on the merge call), and
# GitHub's branch rules decide whether the required checks have passed at that moment. So
# a later push can never merge on the strength of an earlier review: GitHub refuses a
# pinned merge whose head has moved. That's also why this doesn't queue GitHub auto-merge —
# a queued auto-merge isn't pinned and would merge a newer head. Instead it retries
# whenever Greptile finishes a review or a required-check workflow finishes.
#
# How a finding is counted: a top-level review comment by greptile-apps[bot] whose body
# opens with a P0/P1 badge, whose `commit_id` is the head commit, and whose thread isn't
# resolved. GitHub moves `commit_id` forward when later pushes leave the line untouched, so
# an earlier finding on an unchanged line still counts until someone resolves its thread.
#
# Greptile's own check passes even when it leaves findings, so its conclusion only tells
# us a review happened. Greptile also skips some pushes; no review on the head = no merge.
#
# Kill switch (Greptile trial):  gh workflow disable greptile-automerge.yml
# Re-evaluate a PR by hand (e.g. after resolving a Greptile thread — there's no Actions
# event for that):              gh workflow run greptile-automerge.yml -f pr=<number>
#
# Merges use the auto-merge GitHub App's token, not GITHUB_TOKEN: a merge made with
# GITHUB_TOKEN doesn't trigger other workflows (deploys, exponential-promote).
# check_run and workflow_run workflows only run from the copy of this file on the default
# branch.

on:
  check_run:
    types: [completed]
  workflow_run:
    # The workflows that produce the required checks, across the CLEAR repos. A name a
    # repo doesn't have is ignored.
    workflows: [CI, E2E smoke, Unit tests]
    types: [completed]
  pull_request:
    types: [synchronize, reopened, ready_for_review, converted_to_draft, labeled, unlabeled]
  workflow_dispatch:
    inputs:
      pr:
        description: PR number to re-evaluate
        required: true

concurrency:
  group: greptile-automerge-${{ github.event.pull_request.head.ref || github.event.check_run.check_suite.head_branch || github.event.workflow_run.head_branch || inputs.pr }}
  cancel-in-progress: false

permissions:
  contents: read
  pull-requests: write
  issues: write
  checks: read

env:
  # Dry run: decide and post the PR comment, but never merge.
  DRY_RUN: 'false'

jobs:
  evaluate:
    if: >-
      (github.event_name == 'check_run' && github.event.check_run.app.slug == 'greptile-apps') ||
      (github.event_name == 'workflow_run' && github.event.workflow_run.event == 'pull_request' &&
        github.event.workflow_run.conclusion == 'success') ||
      (github.event_name == 'pull_request' &&
        github.event.pull_request.head.repo.full_name == github.repository &&
        github.actor != 'dependabot[bot]' &&
        (!contains(fromJSON('["labeled","unlabeled"]'), github.event.action) || github.event.label.name == 'no-automerge')) ||
      github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - id: app-token
        if: env.DRY_RUN != 'true'
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.AUTOMERGE_APP_CLIENT_ID }}
          private-key: ${{ secrets.AUTOMERGE_APP_PRIVATE_KEY }}

      - uses: actions/github-script@v9
        env:
          BOT_LOGIN: ${{ steps.app-token.outputs.app-slug && format('{0}[bot]', steps.app-token.outputs.app-slug) || 'github-actions[bot]' }}
        with:
          github-token: ${{ steps.app-token.outputs.token || github.token }}
          script: |
            const { owner, repo } = context.repo;
            const dryRun = process.env.DRY_RUN === 'true';
            const botLogin = process.env.BOT_LOGIN;
            const base = context.payload.repository.default_branch;
            const MARKER = '<!-- greptile-automerge -->';
            const LABEL = 'no-automerge';
            const BLOCKING = /^\s*(<a[^>]*>\s*)?<img[^>]*alt="(P[01])"/;

            let numbers;
            if (context.eventName === 'check_run' || context.eventName === 'workflow_run') {
              const event = context.payload.check_run ?? context.payload.workflow_run;
              const sha = event.head_sha;
              const branch = event.check_suite?.head_branch ?? event.head_branch;
              if (context.eventName === 'check_run') {
                // Greptile posts its comments a few seconds before it completes the check;
                // give the API a moment so we don't read the comment list mid-write.
                await new Promise(r => setTimeout(r, 10000));
              }
              // Also match on branch: runs share a concurrency slot per branch, and a newer
              // event for an older commit can replace a pending run for the current one.
              const open = await github.paginate(github.rest.pulls.list, { owner, repo, state: 'open', per_page: 100 });
              numbers = open
                .filter(p => p.head.sha === sha || (branch && p.head.ref === branch && p.head.repo?.full_name === `${owner}/${repo}`))
                .map(p => p.number);
              if (!numbers.length) core.info(`No open PR has ${sha} as its latest commit; nothing to do.`);
            } else if (context.eventName === 'pull_request') {
              numbers = [context.payload.pull_request.number];
            } else {
              numbers = [Number(context.payload.inputs.pr)];
            }
            for (const number of numbers) await evaluate(number);

            async function evaluate(number) {
              const { data: pr } = await github.rest.pulls.get({ owner, repo, pull_number: number });
              if (pr.state !== 'open') return core.info(`#${number} is ${pr.state}; nothing to do.`);
              const sha = pr.head.sha;
              const short = sha.slice(0, 7);
              const skip = reason => report(number, `Greptile auto-merge skipped on \`${short}\`: ${reason}.`);

              if (pr.base.ref !== base) return skip(`the PR targets \`${pr.base.ref}\`; auto-merge only applies to PRs into \`${base}\``);
              if (pr.head.repo?.full_name !== `${owner}/${repo}`) return skip('the PR comes from a fork');
              if (pr.user?.type === 'Bot') return skip(`the PR was opened by a bot (@${pr.user.login})`);
              if (pr.draft) return skip('the PR is a draft');
              if (pr.labels.some(l => l.name === LABEL)) return skip(`the PR has the \`${LABEL}\` label`);

              const { data: { check_runs: runs } } = await github.rest.checks.listForRef({
                owner, repo, ref: sha, check_name: 'Greptile Review', filter: 'latest',
              });
              const run = runs.find(r => r.app?.slug === 'greptile-apps');
              if (!run) return skip(`Greptile hasn't reviewed \`${short}\``);
              if (run.status !== 'completed') return skip(`Greptile's review of \`${short}\` is still running`);
              if (run.conclusion !== 'success') return skip(`Greptile's review of \`${short}\` ended \`${run.conclusion}\``);

              // Threads past the first 100 aren't in this set, so their findings count as
              // unresolved — the safe direction.
              const { repository: { pullRequest: { reviewThreads } } } = await github.graphql(`
                query($owner: String!, $repo: String!, $number: Int!) {
                  repository(owner: $owner, name: $repo) {
                    pullRequest(number: $number) {
                      reviewThreads(first: 100) { nodes { isResolved comments(first: 1) { nodes { databaseId } } } }
                    }
                  }
                }`, { owner, repo, number });
              const resolved = new Set(reviewThreads.nodes
                .filter(t => t.isResolved)
                .map(t => t.comments.nodes[0]?.databaseId));
              const comments = await github.paginate(github.rest.pulls.listReviewComments, {
                owner, repo, pull_number: number, per_page: 100,
              });
              const blocking = comments.filter(c =>
                c.user?.login === 'greptile-apps[bot]' && !c.in_reply_to_id &&
                c.commit_id === sha && !resolved.has(c.id) && BLOCKING.test(c.body));
              if (blocking.length) {
                const links = blocking.map(c => `[${c.body.match(BLOCKING)[2]}](${c.html_url})`).join(', ');
                return skip(`${blocking.length} unresolved P0/P1 finding(s) from Greptile — ${links}`);
              }

              if (dryRun) return report(number, `[dry run] Greptile: no P0/P1 on \`${short}\` — would merge once the required checks pass.`);
              try {
                // Pinned to the reviewed commit: GitHub refuses the merge if the head has moved
                // (409) or a required check hasn't passed (405).
                await github.rest.pulls.merge({ owner, repo, pull_number: number, sha, merge_method: 'squash' });
                return report(number, `Greptile: no P0/P1 on \`${short}\` — required checks passed, merged.`);
              } catch (e) {
                if (e.status === 405) {
                  return report(number, `Greptile: no P0/P1 on \`${short}\` — will merge once GitHub allows it. GitHub says: ${e.message}`);
                }
                if (e.status === 409) return core.info(`#${number}: head moved past ${short} while merging; the newer commit gets its own run.`);
                await report(number, `Greptile: no P0/P1 on \`${short}\`, but the merge failed: ${e.message}`);
                throw e;
              }
            }

            async function report(number, text) {
              core.info(`#${number}: ${text}`);
              await core.summary.addRaw(`#${number}: ${text}\n`).write();
              const body = `${MARKER}\n${text}`;
              const comments = await github.paginate(github.rest.issues.listComments, {
                owner, repo, issue_number: number, per_page: 100,
              });
              const mine = comments.find(c => c.user?.login === botLogin && c.body?.includes(MARKER));
              if (mine?.body === body) return;
              if (mine) await github.rest.issues.updateComment({ owner, repo, comment_id: mine.id, body });
              else await github.rest.issues.createComment({ owner, repo, issue_number: number, body });
            }

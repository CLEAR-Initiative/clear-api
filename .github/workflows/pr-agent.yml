name: PR Agent

# Qodo PR-Agent automated review, wired to Anthropic Claude.
# Runs from the copy of this file on the PR's BASE branch (dev), so it only
# takes effect for PRs targeting dev — the integration branch where review happens.
#
# Manual step (one-time): the repo secret PR_AGENT_ANTHROPIC_KEY must exist, e.g.
#   gh secret set PR_AGENT_ANTHROPIC_KEY
# A dedicated key (separate from any app-level ANTHROPIC key) keeps PR-Agent's
# Anthropic spend on its own billing line. Until it is set, the auth step fails
# (litellm AuthenticationError: invalid x-api-key). No OPENAI_API_KEY is required —
# config.fallback_models points at another Anthropic model to stop PR-Agent
# from initialising an OpenAI client (qodo-ai/pr-agent#1323).

on:
  pull_request:
    types: [opened, reopened, ready_for_review, synchronize]
  issue_comment:
    types: [created]

jobs:
  pr_agent:
    # Loop guard: ignore events triggered by bots (incl. PR-Agent itself).
    if: ${{ github.event.sender.type != 'Bot' }}
    runs-on: ubuntu-latest
    permissions:
      issues: write
      pull-requests: write
      contents: write
    steps:
      - name: PR Agent
        uses: qodo-ai/pr-agent@main
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ANTHROPIC.KEY: ${{ secrets.PR_AGENT_ANTHROPIC_KEY }}
          config.model: "anthropic/claude-sonnet-4-6"
          config.fallback_models: '["anthropic/claude-sonnet-4-6"]'
          github_action_config.auto_review: "true"
          github_action_config.auto_describe: "true"
          github_action_config.auto_improve: "true"
          # Webhook pull_request action types that trigger the auto tools.
          # Must mirror the `on: pull_request: types` above — these are event
          # action names (NOT tool names like "review"/"improve").
          github_action_config.pr_actions: '["opened", "reopened", "ready_for_review", "synchronize"]'

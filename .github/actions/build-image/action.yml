name: Build & push image
description: Build the clear-api image for an environment and push it to GHCR

inputs:
  environment:
    description: Target environment, used as image tag prefix
    required: true
  version:
    description: MAJOR.MINOR.PATCH version
    required: true
  registry:
    description: Container registry
    default: ghcr.io
  registry-token:
    description: Token allowed to push to the registry
    required: true

outputs:
  image:
    description: Image reference tagged with ENV-MAJOR.MINOR.PATCH
    value: ${{ steps.meta.outputs.image }}:${{ inputs.environment }}-${{ inputs.version }}

runs:
  using: composite
  steps:
    - name: Compute image name
      id: meta
      shell: bash
      env:
        REGISTRY: ${{ inputs.registry }}
      run: echo "image=${REGISTRY}/${GITHUB_REPOSITORY_OWNER,,}/clear-api" >> "$GITHUB_OUTPUT"

    - name: Log in to registry
      uses: docker/login-action@v3
      with:
        registry: ${{ inputs.registry }}
        username: ${{ github.actor }}
        password: ${{ inputs.registry-token }}

    - name: Set up buildx
      uses: docker/setup-buildx-action@v3

    - name: Build and push
      uses: docker/build-push-action@v6
      with:
        context: .
        platforms: linux/amd64
        push: true
        tags: |
          ${{ steps.meta.outputs.image }}:${{ inputs.environment }}
          ${{ steps.meta.outputs.image }}:${{ inputs.environment }}-${{ inputs.version }}
        cache-from: type=gha,scope=${{ inputs.environment }}
        cache-to: type=gha,mode=max,scope=${{ inputs.environment }}
